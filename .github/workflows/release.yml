name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - name: Download SQLite amalgamation
        run: |
          curl -fsSL https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip -o sqlite.zip
          unzip -q sqlite.zip
      - name: Build linux-x64
        run: |
          zig build-exe main.zig \
            -cflags -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -- \
            sqlite-amalgamation-3490100/sqlite3.c \
            -I sqlite-amalgamation-3490100 \
            -target x86_64-linux-musl -O ReleaseFast -lc \
            -femit-bin=agy-statusline
          tar -czf agy-statusline-linux-x64.tar.gz agy-statusline
      - name: Build native desktop backend (linux-x64)
        run: |
          cp VERSION desktop-panel/VERSION  # backend.zig embeds it via @embedFile
          rm -rf .zig-cache
          zig cc -c sqlite-amalgamation-3490100/sqlite3.c \
            -I sqlite-amalgamation-3490100 \
            -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION \
            -target x86_64-linux-musl -O2 -o sqlite3.o
          zig build-obj desktop-panel/backend.zig \
            -target x86_64-linux-musl -O ReleaseSafe -lc -fcompiler-rt \
            -femit-bin=backend.o
          zig cc backend.o sqlite3.o -target x86_64-linux-musl -s -lc -o agy-desktop-backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-desktop-backend-linux-x64
          path: agy-desktop-backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-statusline-linux-x64
          path: agy-statusline-linux-x64.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - name: Download SQLite amalgamation
        run: |
          curl -fsSL https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip -o sqlite.zip
          unzip -q sqlite.zip
      - name: Build linux-arm64
        run: |
          zig build-exe main.zig \
            -cflags -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -- \
            sqlite-amalgamation-3490100/sqlite3.c \
            -I sqlite-amalgamation-3490100 \
            -target aarch64-linux-musl -O ReleaseFast -lc \
            -femit-bin=agy-statusline
          tar -czf agy-statusline-linux-arm64.tar.gz agy-statusline
      - name: Build native desktop backend (linux-arm64)
        run: |
          cp VERSION desktop-panel/VERSION  # backend.zig embeds it via @embedFile
          rm -rf .zig-cache
          zig build-exe desktop-panel/backend.zig \
            -cflags -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -- \
            sqlite-amalgamation-3490100/sqlite3.c \
            -I sqlite-amalgamation-3490100 \
            -target aarch64-linux-musl -O ReleaseSafe -lc \
            -femit-bin=agy-desktop-backend
          for s in llvm-strip aarch64-linux-gnu-strip; do
            if command -v "$s" >/dev/null 2>&1; then
              "$s" agy-desktop-backend
              break
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-desktop-backend-linux-arm64
          path: agy-desktop-backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-statusline-linux-arm64
          path: agy-statusline-linux-arm64.tar.gz

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - name: Build macos-arm64
        run: |
          zig build-obj main.zig -target aarch64-macos.13.0 -O ReleaseFast -lc -fcompiler-rt -femit-bin=main.o
          clang main.o -arch arm64 -mmacosx-version-min=13.0 -lsqlite3 -o agy-statusline
          codesign --force --sign - --identifier io.github.2fa0.agy-statusline agy-statusline
          codesign --verify --verbose agy-statusline
          tar -czf agy-statusline-macos-arm64.tar.gz agy-statusline
      - name: Build and sign native desktop backend (macOS)
        run: |
          cp VERSION desktop-panel/VERSION  # backend.zig embeds it via @embedFile
          zig build-obj desktop-panel/backend.zig -target aarch64-macos.13.0 -O ReleaseSafe -fstrip -lc -fcompiler-rt -femit-bin=desktop.o
          clang desktop.o -arch arm64 -mmacosx-version-min=13.0 -lsqlite3 -o agy-desktop-backend
          codesign --force --sign - --identifier io.github.2fa0.agy-desktop-status agy-desktop-backend
          codesign --verify --verbose agy-desktop-backend
      - name: Build and test macOS notch
        run: |
          ./desktop-panel/macos-notch/build.sh
          ./desktop-panel/macos-notch/test.sh
          codesign --verify --verbose desktop-panel/sidecars/status/agy-notch
          cp agy-desktop-backend desktop-panel/sidecars/status/agy-desktop-backend
          tar -czf agy-statusline-macos-arm64.tar.gz agy-statusline -C desktop-panel sidecars/status/agy-desktop-backend sidecars/status/agy-notch
          AGY_DESKTOP_BACKEND="$PWD/agy-desktop-backend" AGY_STATUSLINE_BINARY="$PWD/agy-statusline" python3 -m unittest discover -s desktop-panel/tests -p test_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-notch-macos-arm64
          path: desktop-panel/sidecars/status/agy-notch
      - name: Verify installers end to end (local mode + quarantine self-heal)
        run: |
          bash -n install.sh
          bash -n desktop-panel/install.sh
          export HOME="$(mktemp -d)"
          ./install.sh --cli-only
          "${HOME}/.gemini/antigravity-cli/agy-statusline" --version

          # Simulate a browser download: the plugin's backend carries quarantine.
          # Never *execute* a quarantined binary here -- a runner with a GUI
          # session can raise a modal Gatekeeper dialog and hang the job -- so we
          # assert the end state instead: quarantine gone and binary runnable.
          mkdir -p desktop-panel/sidecars/status
          cp agy-desktop-backend desktop-panel/sidecars/status/agy-desktop-backend
          xattr -w com.apple.quarantine "0081;00000000;Safari;" desktop-panel/sidecars/status/agy-desktop-backend
          ./install.sh --panel-only
          installed="${HOME}/.gemini/config/plugins/agy-desktop-status/sidecars/status/agy-desktop-backend"
          if xattr -p com.apple.quarantine "${installed}" >/dev/null 2>&1; then
            echo "::error::quarantine survived the install; Gatekeeper self-heal is broken"
            exit 1
          fi
          "${installed}" --version
          ./install.sh --doctor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-desktop-backend-macos-arm64
          path: agy-desktop-backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-statusline-macos-arm64
          path: agy-statusline-macos-arm64.tar.gz

  build-windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1
      - name: Download SQLite amalgamation
        run: |
          curl -fsSL https://www.sqlite.org/2025/sqlite-amalgamation-3490100.zip -o sqlite.zip
          unzip -q sqlite.zip
      - name: Build windows-x64
        run: |
          zig build-exe main.zig \
            -cflags -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -- \
            sqlite-amalgamation-3490100/sqlite3.c \
            -I sqlite-amalgamation-3490100 \
            -target x86_64-windows-gnu -O ReleaseFast -lc \
            -femit-bin=agy-statusline.exe
          zip -q agy-statusline-windows-x64.zip agy-statusline.exe
      - name: Build native desktop backend (windows-x64)
        run: |
          cp VERSION desktop-panel/VERSION  # backend.zig embeds it via @embedFile
          zig build-exe desktop-panel/backend.zig \
            -cflags -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION -- \
            sqlite-amalgamation-3490100/sqlite3.c \
            -I sqlite-amalgamation-3490100 \
            -target x86_64-windows-gnu -O ReleaseSafe -fstrip -lc \
            -femit-bin=agy-desktop-backend.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-desktop-backend-windows-x64
          path: agy-desktop-backend.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-statusline-windows-x64
          path: agy-statusline-windows-x64.zip

  package-desktop-plugin:
    needs: [build-linux-x64, build-linux-arm64, build-macos-arm64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agy-desktop-backend-*
          path: native-backends
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agy-notch-macos-arm64
          path: desktop-panel/sidecars/status
      - name: Prepare native backend for tests
        run: chmod +x native-backends/agy-desktop-backend-linux-x64/agy-desktop-backend
      - name: Build and test AGY Desktop Status plugin
        run: |
          cd desktop-panel/ui
          npm ci
          npm run build
          git diff --exit-code -- ../dist/index.html ../manifest.json
          cd ..
          AGY_DESKTOP_BACKEND="$GITHUB_WORKSPACE/native-backends/agy-desktop-backend-linux-x64/agy-desktop-backend" python3 -m unittest discover -s tests
          node --test tests/test_sidecar.mjs
      - name: Verify VERSION is the single source of truth
        run: python3 -m unittest discover -s desktop-panel/tests -p 'test_version.py'
      - name: Package desktop plugin archives
        run: |
          mkdir -p staging/agy-desktop-status
          rsync -a \
            --exclude 'ui/node_modules' \
            --exclude 'tests' \
            --exclude '__pycache__' \
            --exclude '.DS_Store' \
            --exclude 'VERSION' \
            desktop-panel/ staging/agy-desktop-status/
          for platform in macos-arm64 linux-x64 linux-arm64 windows-x64; do
            mkdir -p "staging/agy-desktop-status/bin/$platform"
            cp native-backends/agy-desktop-backend-$platform/* "staging/agy-desktop-status/bin/$platform/"
          done
          chmod +x staging/agy-desktop-status/sidecars/status/agy-notch staging/agy-desktop-status/install.sh staging/agy-desktop-status/bin/macos-arm64/agy-desktop-backend staging/agy-desktop-status/bin/linux-x64/agy-desktop-backend staging/agy-desktop-status/bin/linux-arm64/agy-desktop-backend
          tar -C staging -czf agy-desktop-status-plugin.tar.gz agy-desktop-status
          (cd staging && zip -qr ../agy-desktop-status-plugin.zip agy-desktop-status)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agy-desktop-status-plugin
          path: |
            agy-desktop-status-plugin.tar.gz
            agy-desktop-status-plugin.zip

  release:
    needs: [build-linux-x64, build-linux-arm64, build-macos-arm64, build-windows-x64, package-desktop-plugin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # fetch-depth: 0 is required: the notes generator walks all tags/commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Generate release notes from commit history
        run: |
          python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            -o RELEASE_NOTES.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Our own grouped notes; GitHub's generator would only list PRs and
          # this repo commits straight to main, producing an empty body.
          body_path: RELEASE_NOTES.md
          files: |
            dist/agy-statusline-linux-x64.tar.gz
            dist/agy-statusline-linux-arm64.tar.gz
            dist/agy-statusline-macos-arm64.tar.gz
            dist/agy-statusline-windows-x64.zip
            dist/agy-desktop-status-plugin.tar.gz
            dist/agy-desktop-status-plugin.zip
            dist/SHA256SUMS.txt
