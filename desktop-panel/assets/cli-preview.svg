<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'PingFang SC', monospace">
  <defs>
    <filter id="termShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <clipPath id="termClip">
      <rect x="16" y="12" width="848" height="536" rx="12" />
    </clipPath>
    <linearGradient id="agyLogoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="45%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Terminal Window (Dark Theme) -->
  <rect x="16" y="12" width="848" height="536" rx="12" fill="#131417" stroke="#2c2f36" stroke-width="1.5" filter="url(#termShadow)" />

  <g clip-path="url(#termClip)">
    <!-- macOS Title Bar -->
    <rect x="16" y="12" width="848" height="34" fill="#1f2127" />
    <line x1="16" y1="46" x2="864" y2="46" stroke="#2b2e37" stroke-width="1" />

    <!-- macOS Traffic Lights -->
    <circle cx="34" cy="29" r="5.5" fill="#ff5f56" />
    <circle cx="52" cy="29" r="5.5" fill="#ffbd2e" />
    <circle cx="70" cy="29" r="5.5" fill="#27c93f" />

    <!-- Terminal Title -->
    <g transform="translate(88, 21)">
      <rect x="0" y="2" width="14" height="12" rx="2" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="19" y="12" fill="#d1d5db" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">~/projects/my-app — agy</text>
    </g>

    <!-- AGY CLI Header Banner (Sanitized) -->
    <g transform="translate(32, 66)">
      <!-- Pixel-style A Logo -->
      <g fill="url(#agyLogoGrad)">
        <rect x="18" y="0" width="12" height="8" />
        <rect x="12" y="8" width="24" height="8" />
        <rect x="8" y="16" width="10" height="10" />
        <rect x="30" y="16" width="10" height="10" />
        <rect x="4" y="26" width="40" height="8" />
        <rect x="0" y="34" width="12" height="14" />
        <rect x="36" y="34" width="12" height="14" />
      </g>
      <text x="68" y="12" fill="#3b82f6" font-size="13" font-weight="700">Antigravity CLI</text>
      <text x="68" y="28" fill="#9ca3af" font-size="12">developer@example.com (Google AI Pro)</text>
      <text x="68" y="44" fill="#9ca3af" font-size="12">Gemini 4 Hydrogen (High) · ~/projects/my-app</text>
    </g>

    <!-- Conversation Content inside agy CLI -->
    <g transform="translate(32, 146)" font-size="12.5">
      <!-- User Prompt -->
      <text x="0" y="0" fill="#38bdf8">&gt; 帮我检查下缓存命中率和上下文压缩状态</text>

      <!-- Thinking & Tool Steps -->
      <text x="0" y="28" fill="#9ca3af">○ Thought for 4.2s (Inspecting local session telemetry &amp; prompt cache metrics...)</text>
      <text x="0" y="50">
        <tspan fill="#4ade80">● Read</tspan>
        <tspan fill="#e5e7eb"> 2 files (main.zig, telemetry.py) </tspan>
        <tspan fill="#6b7280">(ctrl+o to expand)</tspan>
      </text>

      <!-- Agent Output -->
      <text x="0" y="82" fill="#e5e7eb">当前会话状态正常（100% 本地只读采集，零外部网络请求）：</text>
      <text x="0" y="110" fill="#d1d5db">1. <tspan fill="#38bdf8">Prompt Cache 命中率</tspan>：<tspan fill="#4ade80" font-weight="600">96.5%</tspan>（读取 71K / 未缓存输入 2K）。</text>
      <text x="0" y="134" fill="#d1d5db">2. <tspan fill="#38bdf8">上下文窗口</tspan>：<tspan fill="#e5e7eb" font-weight="600">73K / 1,048K</tspan>（7.0%），<tspan fill="#c084fc">Compact: 0</tspan>。</text>
      <text x="0" y="158" fill="#d1d5db">3. <tspan fill="#38bdf8">最近平均速度</tspan>：<tspan fill="#e5e7eb" font-weight="600">255 tok/s</tspan>（低于 50 tok/s 时状态栏自动黄底告警）。</text>
      <text x="0" y="182" fill="#d1d5db">4. <tspan fill="#38bdf8">模型额度快照</tspan>：已自动同步至 <tspan fill="#c084fc">quota.json</tspan>，供桌面端面板换算本地重置时间。</text>

      <!-- Info Callout Box -->
      <rect x="0" y="210" width="3" height="44" rx="1.5" fill="#f59e0b" />
      <text x="14" y="223" fill="#e5e7eb" font-weight="700">100% Compliant · Local Read-Only</text>
      <text x="14" y="239" fill="#9ca3af">Zero network · No OAuth/token access · Official statusLine extension</text>
      <text x="14" y="253" fill="#6b7280">esc to dismiss</text>
    </g>

    <!-- AGY CLI Input Prompt Box -->
    <g transform="translate(16, 434)">
      <line x1="0" y1="0" x2="848" y2="0" stroke="#374151" stroke-width="1" />
      <text x="14" y="22" fill="#f472b6" font-size="12.5" font-weight="700">&gt;</text>
      <rect x="27" y="10" width="7" height="15" fill="#9ca3af" />
      <text x="38" y="22" fill="#6b7280" font-size="12.2">Auto mode: edits &amp; safe commands auto-approved (shift+tab to cycle)</text>
      <line x1="0" y1="34" x2="848" y2="34" stroke="#374151" stroke-width="1" />
    </g>

    <!-- AGY Default Status Line (stack_with_default: true) -->
    <g transform="translate(28, 488)" font-size="12">
      <text x="0" y="0" fill="#6b7280">? for shortcuts</text>
      <text x="824" y="0" fill="#6b7280" text-anchor="end">
        <tspan fill="#d97706">auto</tspan>
        <tspan fill="#6b7280"> · Gemini 4 Hydrogen · high</tspan>
      </text>
    </g>

    <!-- ======================================================================= -->
    <!-- agy-statusline Bottom Bar                                               -->
    <!-- ======================================================================= -->
    <g transform="translate(22, 502)">
      <!-- Full-width Blue Status Bar (\x1b[44;97m) -->
      <rect x="0" y="0" width="836" height="26" fill="#1d64c8" />

      <!-- Left Telemetry Metrics -->
      <text x="7" y="17" fill="#ffffff" font-size="11">Cache hit: 96.5% | Cache read: 71K | Ctx: 73K/1,048K | Last avg speed: 255 token/s | Compact: 0 |</text>

      <!-- Gemini Quota Badge (\x1b[46;30m Cyan) -->
      <rect x="536" y="0" width="110" height="26" fill="#2cc3b5" />
      <text x="591" y="17" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">Gemini 93% · 64%</text>

      <!-- Argon Quota Badge (\x1b[106;30m Bright Cyan) -->
      <rect x="646" y="0" width="68" height="26" fill="#5ce1e6" />
      <text x="680" y="17" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">Argon 71%</text>

      <!-- Claude Quota Badge (\x1b[48;5;208;30m Orange) -->
      <rect x="714" y="0" width="122" height="26" fill="#ea8024" />
      <text x="775" y="17" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">Claude 100% · 100%</text>
    </g>
  </g>
</svg>
