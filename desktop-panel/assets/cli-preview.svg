<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'PingFang SC', monospace">
  <defs>
    <filter id="ghosttyShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <clipPath id="termClip">
      <rect x="16" y="12" width="848" height="366" rx="11" />
    </clipPath>
  </defs>

  <!-- Ghostty Terminal Window (Dark Theme matching screenshot) -->
  <rect x="16" y="12" width="848" height="366" rx="11" fill="#131417" stroke="#2c2f36" stroke-width="1.5" filter="url(#ghosttyShadow)" />

  <g clip-path="url(#termClip)">
    <!-- macOS Title Bar (Ghostty) -->
    <rect x="16" y="12" width="848" height="32" fill="#1f2127" />
    <line x1="16" y1="44" x2="864" y2="44" stroke="#2b2e37" stroke-width="1" />

    <!-- macOS Traffic Lights -->
    <circle cx="34" cy="28" r="5.5" fill="#ff5f56" />
    <circle cx="52" cy="28" r="5.5" fill="#ffbd2e" />
    <circle cx="70" cy="28" r="5.5" fill="#27c93f" />

    <!-- Terminal Title: agy -->
    <g transform="translate(88, 20)">
      <rect x="0" y="2" width="14" height="12" rx="2" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="19" y="12" fill="#d1d5db" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">agy</text>
    </g>

    <!-- Conversation Content inside agy CLI -->
    <g transform="translate(28, 66)" font-size="12.2">
      <!-- User Prompt -->
      <text x="0" y="0" fill="#38bdf8">&gt; 嗯，可以，你帮我搞下？</text>

      <!-- Thinking & Tool Steps -->
      <text x="0" y="22" fill="#9ca3af">○ Thought for 13.8s (Initial focus is on condensing the README file to be more concise and user-friendly...)</text>
      <text x="0" y="40">
        <tspan fill="#4ade80">● Edited</tspan>
        <tspan fill="#e5e7eb"> 1 file (README.md) </tspan>
        <tspan fill="#6b7280">(ctrl+o to expand)</tspan>
      </text>

      <!-- Agent Output -->
      <text x="0" y="64" fill="#e5e7eb">已把 <tspan fill="#3b82f6" text-decoration="underline">README.md</tspan> 瘦身完成（从 101 行精简到 36 行），只保留了：</text>
      <text x="0" y="88" fill="#d1d5db">1. 项目定位：核心模块与两个子项目的角色说明。</text>
      <text x="0" y="108" fill="#d1d5db">2. 本地开发与验证命令：环境要求与根目录 <tspan fill="#c084fc">make</tspan> 常用命令。</text>
      <text x="0" y="128" fill="#d1d5db">3. 文档导航：指向 <tspan fill="#c084fc">docs/</tspan> 下的设计/规范文档和三份 <tspan fill="#c084fc">AGENTS.md</tspan>。</text>

      <!-- Info Callout Box (Yellow left bar) -->
      <rect x="10" y="148" width="3" height="44" rx="1.5" fill="#f59e0b" />
      <text x="22" y="160" fill="#e5e7eb" font-weight="700">Introducing Gemini 4 Neon</text>
      <text x="22" y="175" fill="#9ca3af">Our best balance of intelligence, cost, and latency. Get building today with Neon.</text>
      <text x="22" y="190" fill="#6b7280">esc to dismiss</text>
    </g>

    <!-- AGY CLI Input Prompt Box -->
    <g transform="translate(16, 276)">
      <line x1="0" y1="0" x2="848" y2="0" stroke="#374151" stroke-width="1" />
      <text x="12" y="20" fill="#f472b6" font-size="12.5" font-weight="700">&gt;</text>
      <rect x="25" y="8" width="7" height="15" fill="#9ca3af" />
      <text x="34" y="20" fill="#6b7280" font-size="12.2">Auto mode: edits &amp; safe commands auto-approved (shift+tab to cycle)</text>
      <line x1="0" y1="30" x2="848" y2="30" stroke="#374151" stroke-width="1" />
    </g>

    <!-- AGY Default Status Line (stack_with_default: true) -->
    <g transform="translate(26, 326)" font-size="12">
      <text x="0" y="0" fill="#6b7280">? for shortcuts</text>
      <text x="826" y="0" fill="#6b7280" text-anchor="end">
        <tspan fill="#d97706">auto</tspan>
        <tspan fill="#6b7280"> · Gemini 4 Hydrogen · high</tspan>
      </text>
    </g>

    <!-- ======================================================================= -->
    <!-- agy-statusline Bottom Bar (Exact match to screenshot)                   -->
    <!-- ======================================================================= -->
    <g transform="translate(22, 338)">
      <!-- Full-width Blue Status Bar (\x1b[44;97m) -->
      <rect x="0" y="0" width="836" height="24" fill="#1d64c8" />

      <!-- Left Telemetry Metrics -->
      <text x="6" y="16" fill="#ffffff" font-size="11.8">Cache hit: 95.6% | Cache read: 59K | Ctx: 62K/1,048K | Last avg speed: 170 token/s |</text>

      <!-- Gemini Quota Badge (\x1b[46;30m Cyan) -->
      <rect x="526" y="0" width="114" height="24" fill="#2cc3b5" />
      <text x="583" y="16" fill="#111827" font-size="11.8" font-weight="600" text-anchor="middle">Gemini 25% · 70%</text>

      <!-- Argon Quota Badge (\x1b[106;30m Bright Cyan) -->
      <rect x="640" y="0" width="70" height="24" fill="#5ce1e6" />
      <text x="675" y="16" fill="#111827" font-size="11.8" font-weight="600" text-anchor="middle">Argon 72%</text>

      <!-- Claude Quota Badge (\x1b[48;5;208;30m Orange) -->
      <rect x="710" y="0" width="126" height="24" fill="#ea8024" />
      <text x="773" y="16" fill="#111827" font-size="11.8" font-weight="600" text-anchor="middle">Claude 100% · 100%</text>
    </g>
  </g>
</svg>
