        <!-- Detail Strip -->
        <rect x="10" y="24" width="356" height="22" rx="5" fill="#f1f5f9" />
        <text x="17" y="39" fill="#1e293b" font-size="10" font-weight="600">#28 <tspan fill="#64748b" font-weight="400">· gemini-4-hydrogen</tspan></text>
        <text x="359" y="39" fill="#64748b" font-size="10" text-anchor="end"><tspan fill="#1677ff" font-weight="600">210.4 tok/s</tspan> · 输出 2,218 tok · 耗时 4.86s</text>

        <!-- 12 Speed Bars -->
        <g transform="translate(10, 52)">
          <rect x="2" y="32" width="24" height="14" rx="2" fill="#69b1ff" />
          <rect x="32" y="30" width="24" height="16" rx="2" fill="#69b1ff" />
          <rect x="62" y="14" width="24" height="32" rx="2" fill="#1677ff" />
          <rect x="92" y="36" width="24" height="10" rx="2" fill="#69b1ff" />
          <rect x="122" y="33" width="24" height="13" rx="2" fill="#69b1ff" />
          <rect x="152" y="38" width="24" height="8" rx="2" fill="#ca8a04" />
          <rect x="182" y="34" width="24" height="12" rx="2" fill="#69b1ff" />
          <rect x="212" y="36" width="24" height="10" rx="2" fill="#69b1ff" />
          <rect x="242" y="33" width="24" height="13" rx="2" fill="#69b1ff" />
          <rect x="272" y="38" width="24" height="8" rx="2" fill="#69b1ff" />
          <rect x="302" y="6" width="24" height="40" rx="2" fill="#1677ff" />
          <rect x="332" y="29" width="24" height="17" rx="2" fill="#69b1ff" />
          <line x1="0" y1="47" x2="356" y2="47" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />
        </g>
        <text x="10" y="114" fill="#64748b" font-size="10">▸ 近期记录</text>
      </g>

      <!-- 6. Context Trend Card -->
      <g transform="translate(0, 352)">
        <rect x="0" y="0" width="376" height="126" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
        <text x="10" y="17" fill="#475569" font-size="10.5" font-weight="600">上下文趋势</text>
        <text x="366" y="17" fill="#64748b" font-size="10" text-anchor="end">压缩 0 次</text>

        <!-- Detail Strip -->
        <rect x="10" y="24" width="356" height="22" rx="5" fill="#f1f5f9" />
        <text x="17" y="39" fill="#1e293b" font-size="10" font-weight="600">#23 <tspan fill="#64748b" font-weight="400">· gemini-4-hydrogen</tspan></text>
        <text x="359" y="39" fill="#64748b" font-size="10" text-anchor="end"><tspan fill="#1677ff" font-weight="600">58,160 tok</tspan> · 11:48:08</text>

        <!-- Line Chart Area -->
        <g transform="translate(10, 52)">
          <line x1="0" y1="6" x2="356" y2="6" stroke="#f1f5f9" stroke-width="1" />
          <line x1="0" y1="24" x2="356" y2="24" stroke="#f1f5f9" stroke-width="1" />
          <line x1="0" y1="42" x2="356" y2="42" stroke="#f1f5f9" stroke-width="1" />
          <text x="2" y="12" fill="#64748b" font-size="9">73K tok</text>
          <text x="354" y="12" fill="#64748b" font-size="9" text-anchor="end">最近 38 次</text>

          <!-- Context Line -->
          <polyline fill="none" stroke="#1677ff" stroke-width="1.6"
            points="6,41 26,39 46,38 66,36 86,34 106,33 126,31 146,29 166,27 186,25 206,23 226,20 246,19 266,18 286,16 306,15 326,13 348,12" />
          <!-- Sample Data Points -->
          <circle cx="6" cy="41" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />
          <circle cx="46" cy="38" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />
          <circle cx="86" cy="34" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />
          <circle cx="126" cy="31" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />
          <circle cx="166" cy="27" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />
          <circle cx="206" cy="23" r="3.5" fill="#1677ff" />
          <circle cx="246" cy="19" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />
          <circle cx="286" cy="16" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />
          <circle cx="326" cy="13" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />
          <circle cx="348" cy="12" r="2.2" fill="#ffffff" stroke="#1677ff" stroke-width="1.4" />

          <text x="2" y="54" fill="#94a3b8" font-size="9">#1</text>
