<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', sans-serif">
  <defs>
    <filter id="windowShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <clipPath id="windowClip">
      <rect x="16" y="12" width="848" height="536" rx="12" />
    </clipPath>
  </defs>

  <!-- Outer Antigravity 2.0 Window (Light Theme) -->
  <rect x="16" y="12" width="848" height="536" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#windowShadow)" />

  <g clip-path="url(#windowClip)">
    <!-- Left Chat Area Context (Antigravity 2.0 Main Canvas, Sanitized) -->
    <rect x="16" y="12" width="444" height="536" fill="#ffffff" />

    <!-- Top Breadcrumb Bar (Left Pane) -->
    <g transform="translate(34, 24)">
      <text x="0" y="15" fill="#64748b" font-size="12.5" font-weight="500">my-app</text>
      <text x="54" y="15" fill="#cbd5e1" font-size="12.5">/</text>
      <text x="66" y="15" fill="#1e293b" font-size="12.5" font-weight="600">UI Telemetry &amp; Context Trend</text>
      <!-- Auxiliary Panel Toggle Icon -->
      <rect x="394" y="2" width="18" height="16" rx="3" fill="none" stroke="#64748b" stroke-width="1.3" />
      <line x1="406" y1="2" x2="406" y2="18" stroke="#64748b" stroke-width="1.3" />
    </g>
    <line x1="16" y1="50" x2="460" y2="50" stroke="#e5e7eb" stroke-width="1" />

    <!-- Chat Messages Mock in Left Pane -->
    <g transform="translate(36, 74)">
      <!-- User Message Bubble (Right aligned) -->
      <rect x="128" y="0" width="274" height="36" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
      <text x="144" y="22" fill="#1e293b" font-size="12">上下趋势图支持交互了吗？顺便看下当前缓存和速度</text>

      <!-- Agent Response Summary -->
      <text x="0" y="64" fill="#94a3b8" font-size="11.5">Worked for 1m  ›</text>
      <text x="0" y="88" fill="#1e293b" font-size="12.5">已升级右侧 <tspan font-weight="600">AGY Status</tspan> 面板的交互式图表与遥测视图：</text>

      <text x="8" y="116" fill="#334155" font-size="12">• <tspan font-weight="600">输出速度 &amp; 实时流式测速</tspan>：生成中自动切换为 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1677ff">≈ tok/s</tspan> 估算</text>
      <text x="8" y="138" fill="#334155" font-size="12">• <tspan font-weight="600">上下文趋势曲线</tspan>：支持悬浮查看单次请求 token、时间与压缩标记</text>
      <text x="8" y="160" fill="#334155" font-size="12">• <tspan font-weight="600">用量 / 额度分栏</tspan>：按模型拆分 token 与缓存命中率，展示本地重置时间</text>
      <text x="8" y="182" fill="#334155" font-size="12">• <tspan font-weight="600">100% 本地只读</tspan>：<tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#16a34a">Zero Network</tspan>，不读取凭据或探测内部 RPC</text>

      <!-- File Change Review Bar -->
      <rect x="0" y="206" width="402" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="228" fill="#334155" font-size="12" font-weight="500">2 files changed</text>
      <text x="108" y="228" fill="#16a34a" font-size="12" font-weight="600">+119</text>
      <text x="142" y="228" fill="#dc2626" font-size="12" font-weight="600">-13</text>
      <rect x="334" y="213" width="58" height="22" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="363" y="228" fill="#334155" font-size="11" font-weight="500" text-anchor="middle">Review</text>
    </g>

    <!-- Bottom Chat Composer Box (Left Pane) -->
    <g transform="translate(34, 456)">
      <rect x="0" y="0" width="406" height="72" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
      <text x="16" y="24" fill="#94a3b8" font-size="12.5">Ask anything, @ to mention, / for actions</text>
      <text x="16" y="56" fill="#64748b" font-size="11.5">+   Gemini 4 Hydrogen Medium  ⌄</text>
      <text x="342" y="56" fill="#64748b" font-size="11.5">⚡ Turbo ⌄</text>
      <circle cx="388" cy="52" r="10" fill="#18181b" />
    </g>

    <!-- Vertical Splitter between Chat and Auxiliary Side Pane -->
    <line x1="460" y1="12" x2="460" y2="548" stroke="#e5e7eb" stroke-width="1.2" />

    <!-- ================================================================= -->
    <!-- RIGHT AUXILIARY PANE: AGY Status (Updated 2x2 + Tabs + 2 Charts)  -->
    <!-- ================================================================= -->
    <rect x="461" y="12" width="403" height="536" fill="#f7f7f8" />

    <!-- Auxiliary Pane Header Bar -->
    <rect x="461" y="12" width="403" height="38" fill="#ffffff" />
    <line x1="461" y1="50" x2="864" y2="50" stroke="#e5e7eb" stroke-width="1" />

    <!-- AGY Status Tab Pill -->
    <g transform="translate(472, 19)">
      <rect x="0" y="0" width="102" height="24" rx="6" fill="#f1f5f9" />
      <rect x="8" y="6" width="12" height="12" rx="2.5" fill="#1677ff" />
      <text x="14" y="15" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">&gt;_</text>
      <text x="25" y="16" fill="#1e293b" font-size="12" font-weight="600">AGY Status</text>
      <text x="91" y="16" fill="#64748b" font-size="12">×</text>
      <text x="114" y="17" fill="#64748b" font-size="15">+</text>
    </g>
    <text x="826" y="35" fill="#64748b" font-size="12">⛶</text>
    <text x="844" y="36" fill="#64748b" font-size="14">×</text>

    <!-- Auxiliary Pane Inner Shell -->
    <g transform="translate(474, 58)">
      <!-- 1. Toolbar Row -->
      <circle cx="6" cy="13" r="3.5" fill="#16a34a" />
      <circle cx="6" cy="13" r="6.5" fill="#16a34a" fill-opacity="0.16" />

      <rect x="18" y="0" width="292" height="26" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <text x="27" y="17" fill="#1d1f21" font-size="11.5">自动跟随当前活跃会话</text>
      <path d="M295 11 L299 15 L303 11" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" />

      <rect x="316" y="0" width="60" height="26" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
