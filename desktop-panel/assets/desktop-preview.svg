          <rect x="92" y="39" width="24" height="5" rx="2" fill="#a16207" />
          <!-- Bar 5 (#8: 294.4) -->
          <rect x="122" y="28" width="24" height="16" rx="2" fill="#2563eb" fill-opacity="0.78" />
          <!-- Bar 6 (#9: 5.0 warn) -->
          <rect x="152" y="39" width="24" height="5" rx="2" fill="#a16207" />
          <!-- Bar 7 (#10: 195.4) -->
          <rect x="182" y="33" width="24" height="11" rx="2" fill="#2563eb" fill-opacity="0.78" />
          <!-- Bar 8 (#11: 574.8) -->
          <rect x="212" y="16" width="24" height="28" rx="2" fill="#2563eb" fill-opacity="0.78" />
          <!-- Bar 9 (#12: 405.5) -->
          <rect x="242" y="24" width="24" height="20" rx="2" fill="#2563eb" fill-opacity="0.78" />
          <!-- Bar 10 (#13: 6.5 warn) -->
          <rect x="272" y="39" width="24" height="5" rx="2" fill="#a16207" />
          <!-- Bar 11 (#14: 240.9) -->
          <rect x="302" y="31" width="24" height="13" rx="2" fill="#2563eb" fill-opacity="0.78" />
          <!-- Bar 12 (#15: 105.1) -->
          <rect x="332" y="36" width="24" height="8" rx="2" fill="#2563eb" fill-opacity="0.78" />

          <line x1="0" y1="46" x2="356" y2="46" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" />
        </g>

        <!-- History List (6 rows: #15 down to #10) -->
        <g transform="translate(10, 113)" font-size="10.8">
          <!-- Row 1 (#15 odd) -->
          <rect x="0" y="0" width="356" height="19" rx="4" fill="#eff0f1" />
          <text x="6" y="13" fill="#5d676f">#15</text>
          <text x="44" y="13" fill="#5d676f">gemini-4-argon-trial</text>
          <text x="292" y="13" fill="#1d1f21" font-weight="600" text-anchor="end">105.1 tok/s</text>
          <text x="350" y="13" fill="#5d676f" text-anchor="end">497 / 7.1s</text>

          <!-- Row 2 (#14 even) -->
          <rect x="0" y="20" width="356" height="19" rx="4" fill="transparent" />
          <text x="6" y="33" fill="#5d676f">#14</text>
          <text x="44" y="33" fill="#5d676f">gemini-4-argon-trial</text>
          <text x="292" y="33" fill="#1d1f21" font-weight="600" text-anchor="end">240.9 tok/s</text>
          <text x="350" y="33" fill="#5d676f" text-anchor="end">737 / 8.7s</text>

          <!-- Row 3 (#13 odd, warn 6.5 tok/s) -->
          <rect x="0" y="40" width="356" height="19" rx="4" fill="#eff0f1" />
          <text x="6" y="53" fill="#5d676f">#13</text>
          <text x="44" y="53" fill="#5d676f">gemini-4-argon-trial</text>
          <text x="292" y="53" fill="#a16207" font-weight="600" text-anchor="end">6.5 tok/s</text>
          <text x="350" y="53" fill="#5d676f" text-anchor="end">46 / 7.1s</text>

          <!-- Row 4 (#12 even) -->
          <rect x="0" y="60" width="356" height="19" rx="4" fill="transparent" />
          <text x="6" y="73" fill="#5d676f">#12</text>
          <text x="44" y="73" fill="#5d676f">gemini-4-argon-trial</text>
          <text x="292" y="73" fill="#1d1f21" font-weight="600" text-anchor="end">405.5 tok/s</text>
          <text x="350" y="73" fill="#5d676f" text-anchor="end">7K / 49.0s</text>

          <!-- Row 5 (#11 odd) -->
          <rect x="0" y="80" width="356" height="19" rx="4" fill="#eff0f1" />
          <text x="6" y="93" fill="#5d676f">#11</text>
          <text x="44" y="93" fill="#5d676f">gemini-4-argon-trial</text>
          <text x="292" y="93" fill="#1d1f21" font-weight="600" text-anchor="end">574.8 tok/s</text>
          <text x="350" y="93" fill="#5d676f" text-anchor="end">128 / 14.0s</text>

          <!-- Row 6 (#10 even) -->
          <rect x="0" y="100" width="356" height="19" rx="4" fill="transparent" />
          <text x="6" y="113" fill="#5d676f">#10</text>
          <text x="44" y="113" fill="#5d676f">gemini-4-argon-trial</text>
          <text x="292" y="113" fill="#1d1f21" font-weight="600" text-anchor="end">195.4 tok/s</text>
