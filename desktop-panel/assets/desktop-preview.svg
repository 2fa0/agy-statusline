        <g transform="translate(0, 82)">
          <rect x="0" y="0" width="184" height="74" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
          <text x="10" y="19" fill="#5d676f" font-size="11">上下文占用</text>
          <text x="174" y="19" fill="#5d676f" font-size="11" text-anchor="end">5.5%</text>
          <text x="10" y="45" fill="#1d1f21" font-size="19" font-weight="600">57K/1,048K</text>
          <rect x="10" y="58" width="164" height="5" rx="2.5" fill="#eff0f1" />
          <rect x="10" y="58" width="12" height="5" rx="2.5" fill="#2563eb" />
        </g>

        <!-- Card (2,2): Cache 命中率 -->
        <g transform="translate(192, 82)">
          <rect x="0" y="0" width="184" height="74" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
          <text x="10" y="19" fill="#5d676f" font-size="11">Cache 命中率</text>
          <text x="10" y="45" fill="#1d1f21" font-size="19" font-weight="600">96.0%</text>
          <text x="10" y="63" fill="#5d676f" font-size="11">Read 55K · In 2K</text>
        </g>
      </g>

      <!-- 4. Recent Generation Speed Trend Section -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="376" height="238" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />

        <!-- Section Header -->
        <text x="10" y="21" fill="#5d676f" font-size="11" font-weight="600">近期生成速度趋势</text>
        <text x="366" y="21" fill="#5d676f" font-size="11" text-anchor="end">最近 12 次 · 均值 249.3 tok/s</text>

        <!-- Spark Detail Banner (Inspecting #7 Low-Speed Item) -->
        <rect x="10" y="29" width="356" height="26" rx="6" fill="#eff0f1" stroke="#e2e8f0" stroke-width="1" />
        <text x="18" y="46" fill="#1d1f21" font-size="11" font-weight="600">#7</text>
        <text x="34" y="46" fill="#5d676f" font-size="11">· gemini-4-argon-trial</text>
        <text x="358" y="46" fill="#5d676f" font-size="11" text-anchor="end">
          <tspan fill="#a16207" font-weight="600">10.5 tok/s</tspan>
          <tspan fill="#5d676f"> · 输出 82 tok · 耗时 7.78s</tspan>
        </text>

        <!-- Sparkline Bars (12 bars, #7 highlighted) -->
        <g transform="translate(10, 61)">
          <!-- Bar 1 (#4: 158.2) -->
          <rect x="2" y="34" width="24" height="10" rx="2" fill="#2563eb" fill-opacity="0.78" />
          <!-- Bar 2 (#5: 827.3 max) -->
          <rect x="32" y="4" width="24" height="40" rx="2" fill="#2563eb" fill-opacity="0.78" />
          <!-- Bar 3 (#6: 95.9) -->
          <rect x="62" y="37" width="24" height="7" rx="2" fill="#2563eb" fill-opacity="0.78" />
          <!-- Bar 4 (#7: 10.5 warn, active column highlight) -->
