        <!-- (2,1) 缓存命中 -->
        <rect x="0" y="68" width="184" height="62" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
        <text x="10" y="84" fill="#64748b" font-size="10.5">缓存命中</text>
        <text x="10" y="106" fill="#111827" font-size="17" font-weight="700">96.5%</text>
        <text x="10" y="122" fill="#64748b" font-size="10">读 71K · 入 2K</text>

        <!-- (2,2) 轮次耗时 -->
        <rect x="192" y="68" width="184" height="62" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
        <text x="202" y="84" fill="#64748b" font-size="10.5">轮次耗时</text>
        <text x="202" y="106" fill="#111827" font-size="17" font-weight="700">1m 16s</text>
        <text x="202" y="122" fill="#64748b" font-size="10">累计 6m 53s</text>
