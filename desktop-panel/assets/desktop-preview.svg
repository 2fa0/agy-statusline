        <rect x="0" y="0" width="184" height="62" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
        <text x="10" y="16" fill="#64748b" font-size="10.5">输出速度</text>
        <text x="10" y="38" fill="#111827" font-size="17" font-weight="700">255.5 tok/s</text>
        <text x="10" y="54" fill="#64748b" font-size="10">624 · 2.2s</text>

        <!-- (1,2) 上下文 -->
        <rect x="192" y="0" width="184" height="62" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
