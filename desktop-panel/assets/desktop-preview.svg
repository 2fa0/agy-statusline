      <!-- 5. Output Speed Trend Card -->
      <g transform="translate(0, 222)">
        <rect x="0" y="0" width="376" height="122" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
        <text x="10" y="17" fill="#475569" font-size="10.5" font-weight="600">输出速度趋势</text>
