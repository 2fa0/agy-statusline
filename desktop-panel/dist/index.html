<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGY Desktop Status</title>
  <style>
    :root {
      color-scheme: light;

      --agy-fg: var(--color-text-primary, var(--foreground, #1d1f21));
      --agy-fg-muted: var(--color-text-secondary, var(--muted-foreground, #5d676f));
      --agy-fg-faint: var(--color-text-tertiary, var(--placeholder, #9da5ab));
      --agy-border: var(--color-border-primary, var(--border, rgba(0, 0, 0, 0.1)));
      --agy-accent: var(--color-ring-primary, var(--primary, #2563eb));
      --agy-accent-soft: rgba(37, 99, 235, 0.12);
      --agy-warn-bg: var(--color-background-warning, rgba(234, 179, 8, 0.12));
      --agy-warn-border: var(--color-border-warning, rgba(202, 138, 4, 0.4));
      --agy-warn-fg: var(--color-text-warning, #a16207);
      --agy-ok-fg: var(--color-text-success, #16a34a);
      --agy-font: var(--font-sans, var(--font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif));
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --agy-bg: var(--color-background-primary, var(--background, #111318));
      --agy-card: var(--color-background-secondary, var(--card, #1a1e26));
      --agy-subtle: var(--color-background-tertiary, var(--muted, #232833));
      --agy-fg: var(--color-text-primary, var(--foreground, #e6e8ee));
      --agy-fg-muted: var(--color-text-secondary, var(--muted-foreground, #9ca3af));
      --agy-fg-faint: var(--color-text-tertiary, var(--placeholder, #6b7280));
      --agy-border: var(--color-border-primary, var(--border, rgba(255, 255, 255, 0.12)));
      --agy-accent: var(--color-ring-primary, var(--primary, #3b82f6));
      --agy-accent-soft: rgba(59, 130, 246, 0.18);
      --agy-warn-bg: var(--color-background-warning, rgba(234, 179, 8, 0.14));
      --agy-warn-border: var(--color-border-warning, rgba(234, 179, 8, 0.45));
      --agy-warn-fg: var(--color-text-warning, #facc15);
      --agy-ok-fg: var(--color-text-success, #22c55e);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--agy-bg);
      color: var(--agy-fg);
      font-family: var(--agy-font);
      font-size: 13px;
      line-height: 1.45;
    }
    .shell {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 960px;
      margin: 0 auto;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--agy-border);
    }
    .session-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 180px;
      min-width: 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: var(--agy-fg-faint);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .dot.live {
      background: var(--agy-ok-fg);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.16);
    }
    select, button {
      font: inherit;
      color: var(--agy-fg);
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .session-row select {
      width: 100%;
      min-width: 0;
      text-overflow: ellipsis;
    }
    .refresh-select {
      width: auto;
      flex: 0 0 auto;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .refresh-select.active {
      border-color: var(--agy-accent);
    }
    button:hover, select:hover {
      background: var(--agy-subtle);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }
    .meta-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--agy-fg-muted);
    }
    .pills-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
    }
    .updated-tag {
      font-size: 11px;
      color: var(--agy-fg-faint);
      font-variant-numeric: tabular-nums;
      margin-left: auto;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      font-size: 11px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (min-width: 680px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
    .card {
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: var(--agy-accent);
    }
    .card.warn {
      background: var(--agy-warn-bg);
      border-color: var(--agy-warn-border);
    }
    .card-label {
      font-size: 11px;
      color: var(--agy-fg-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .card-value {
      font-size: 19px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card.warn .card-value {
      color: var(--agy-warn-fg);
    }
    .card-sub {
      font-size: 11px;
      color: var(--agy-fg-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      height: 5px;
      border-radius: 999px;
      background: var(--agy-subtle);
      overflow: hidden;
      margin-top: 2px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--agy-accent);
      width: 0%;
      transition: width 0.25s ease;
    }
    .bar-fill.high {
      background: var(--agy-warn-fg);
    }
    .section {
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--agy-fg-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .spark-detail {
      font-size: 11px;
      font-weight: 500;
      color: var(--agy-fg);
      background: var(--agy-subtle);
      border: 1px solid var(--agy-border);
      border-radius: 6px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-variant-numeric: tabular-nums;
      min-height: 28px;
    }
    .spark-detail .tag {
      font-weight: 600;
      color: var(--agy-accent);
    }
    .spark-detail .tag.warn {
      color: var(--agy-warn-fg);
    }
    .spark {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 54px;
      padding: 8px 2px 2px;
      border-bottom: 1px dashed var(--agy-border);
    }
    .spark-col {
      flex: 1 1 0;
      min-width: 8px;
      height: 100%;
      display: flex;
      align-items: flex-end;
      cursor: pointer;
      padding: 0 1px;
      border-radius: 4px;
      transition: background 0.12s ease;
    }
    .spark-col:hover,
    .spark-col.active {
      background: var(--agy-accent-soft);
    }
    .spark-bar {
      width: 100%;
      border-radius: 3px 3px 1px 1px;
      background: var(--agy-accent);
      opacity: 0.78;
      transition: height 0.2s ease, opacity 0.12s ease, transform 0.12s ease;
    }
    .spark-col:hover .spark-bar,
    .spark-col.active .spark-bar {
      opacity: 1;
      transform: scaleY(1.03);
    }
    .spark-bar.warn {
      background: var(--agy-warn-fg);
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .history-row {
      display: grid;
      grid-template-columns: 38px 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 4px 6px;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .history-row:nth-child(odd) {
      background: var(--agy-subtle);
    }
    .history-row:hover,
    .history-row.active {
      background: var(--agy-accent-soft);
      border-color: var(--agy-accent);
    }
    .speed-badge {
      font-weight: 600;
    }
    .speed-badge.warn {
      color: var(--agy-warn-fg);
    }
    .muted {
      color: var(--agy-fg-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty {
      padding: 18px 12px;
      text-align: center;
      color: var(--agy-fg-muted);
      font-size: 12px;
    }
  </style>
</head>
