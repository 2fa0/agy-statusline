<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGY Desktop Status</title>
  <style>
    :root {
      color-scheme: light;
      --agy-bg: var(--color-background-primary, var(--background, #f7f7f8));
      --agy-card: var(--color-background-secondary, var(--card, #ffffff));
      --agy-subtle: var(--color-background-tertiary, var(--muted, #eff0f1));
      --agy-fg: var(--color-text-primary, var(--foreground, #1d1f21));
      --agy-fg-muted: var(--color-text-secondary, var(--muted-foreground, #5d676f));
      --agy-fg-faint: var(--color-text-tertiary, var(--placeholder, #9da5ab));
      --agy-border: var(--color-border-primary, var(--border, rgba(0, 0, 0, 0.1)));
      --agy-accent: #1677ff;
      --agy-accent-soft: rgba(22, 119, 255, 0.12);
      --agy-warn-bg: var(--color-background-warning, rgba(234, 179, 8, 0.12));
      --agy-warn-border: var(--color-border-warning, rgba(202, 138, 4, 0.4));
      --agy-warn-fg: var(--color-text-warning, #a16207);
      --agy-ok-fg: var(--color-text-success, #16a34a);
      --agy-ok-soft: rgba(22, 163, 74, 0.12);
      --agy-font: var(--font-sans, var(--font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif));
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --agy-bg: var(--color-background-primary, var(--background, #111318));
      --agy-card: var(--color-background-secondary, var(--card, #1a1e26));
      --agy-subtle: var(--color-background-tertiary, var(--muted, #232833));
      --agy-fg: var(--color-text-primary, var(--foreground, #e6e8ee));
      --agy-fg-muted: var(--color-text-secondary, var(--muted-foreground, #9ca3af));
      --agy-fg-faint: var(--color-text-tertiary, var(--placeholder, #6b7280));
      --agy-border: var(--color-border-primary, var(--border, rgba(255, 255, 255, 0.12)));
      --agy-accent: #3898ff;
      --agy-accent-soft: rgba(56, 152, 255, 0.18);
      --agy-warn-bg: var(--color-background-warning, rgba(234, 179, 8, 0.14));
      --agy-warn-border: var(--color-border-warning, rgba(234, 179, 8, 0.45));
      --agy-warn-fg: var(--color-text-warning, #facc15);
      --agy-ok-fg: var(--color-text-success, #22c55e);
      --agy-ok-soft: rgba(34, 197, 94, 0.16);
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--agy-bg);
      color: var(--agy-fg);
      font-family: var(--agy-font);
      font-size: 13px;
      line-height: 1.45;
    }
    .shell {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 960px;
      margin: 0 auto;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--agy-border);
    }
    .session-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 180px;
      min-width: 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: var(--agy-fg-faint);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .dot.live {
      background: var(--agy-ok-fg);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.16);
    }
    select, button {
      font: inherit;
      color: var(--agy-fg);
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .session-row select {
      width: 100%;
      min-width: 0;
      text-overflow: ellipsis;
    }
    .refresh-select {
      width: auto;
      flex: 0 0 auto;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .refresh-select.active {
      border-color: var(--agy-accent);
    }
    button:hover, select:hover {
      background: var(--agy-subtle);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }
    .meta-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--agy-fg-muted);
      min-height: 20px;
    }
    .meta-main {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }
    .meta-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .updated-tag {
      font-size: 11px;
      color: var(--agy-fg-faint);
      font-variant-numeric: tabular-nums;
      flex: 0 0 auto;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      font-size: 11px;
      flex: 0 0 auto;
    }
    .tabs {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      gap: 3px;
      padding: 3px;
      background: var(--agy-subtle);
      border-radius: 8px;
      border: 1px solid var(--agy-border);
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: var(--agy-fg-muted);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 6px;
      transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .tab-btn:hover {
      background: transparent;
      color: var(--agy-fg);
    }
    .tab-btn.active {
      background: var(--agy-card);
      color: var(--agy-fg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .tab-panel.active {
      display: flex;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    @media (min-width: 680px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
    .card {
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: var(--agy-accent);
    }
    .card.warn {
      background: var(--agy-warn-bg);
      border-color: var(--agy-warn-border);
    }
    .card.live {
      border-color: var(--agy-accent);
      box-shadow: 0 0 0 1px var(--agy-accent-soft) inset;
    }
    .live-pulse {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      margin-right: 5px;
      background: var(--agy-accent);
      animation: agy-pulse 1.1s ease-in-out infinite;
    }
    @keyframes agy-pulse {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .live-pulse,
      .state-dot {
        animation: none;
        opacity: 1;
      }
    }
    .pill.live {
      border-color: var(--agy-accent);
      color: var(--agy-accent);
    }
    /* Session state chip: the colour is the summary, the tooltip carries the
       reason. Waiting is amber, not red — it is not a failure. */
    .state-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid var(--agy-border);
      background: var(--agy-card);
      font-size: 11px;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .state-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--agy-fg-faint);
      flex: 0 0 auto;
    }
    .state-chip.is-idle .state-dot { background: var(--agy-ok-fg); }
    .state-chip.is-running {
      color: var(--agy-accent);
      border-color: var(--agy-accent);
    }
    .state-chip.is-running .state-dot {
      background: var(--agy-accent);
      animation: agy-pulse 1.1s ease-in-out infinite;
    }
    .state-chip.is-waiting {
      color: var(--agy-warn-fg);
      border-color: var(--agy-warn-border);
      background: var(--agy-warn-bg);
    }
    .state-chip.is-waiting .state-dot {
      background: var(--agy-warn-fg);
      animation: agy-pulse 1.5s ease-in-out infinite;
    }
    .state-chip.is-error {
      color: #dc2626;
      border-color: rgba(220, 38, 38, 0.45);
      background: rgba(220, 38, 38, 0.1);
    }
    .state-chip.is-error .state-dot {
      background: #dc2626;
      animation: agy-pulse 1s ease-in-out infinite;
    }
    .state-chip.is-switching {
      color: var(--agy-fg-muted);
      border-style: dashed;
    }
    .state-chip.is-switching .state-dot {
      background: var(--agy-accent);
      animation: agy-pulse 1.1s ease-in-out infinite;
    }
    :root[data-theme="dark"] .state-chip.is-error {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.5);
      background: rgba(248, 113, 113, 0.12);
    }
    :root[data-theme="dark"] .state-chip.is-error .state-dot { background: #f87171; }
    .state-note {
      font-size: 11px;
      line-height: 1.5;
      color: var(--agy-fg-muted);
      padding: 0 2px;
    }
    .state-note[hidden] { display: none; }
    .state-note.is-waiting { color: var(--agy-warn-fg); }
    .state-note.is-error { color: #dc2626; }
    :root[data-theme="dark"] .state-note.is-error { color: #f87171; }
    /* A missing source must not look like a real zero. */
    .sources-note {
      font-size: 11px;
      line-height: 1.5;
      color: var(--agy-warn-fg);
      background: var(--agy-warn-bg);
      border: 1px solid var(--agy-warn-border);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .sources-note[hidden] { display: none; }
    /* Module switches from config.json: hidden sections stay out of layout. */
    /* Switching/failure chips are about the chosen conversation, not the
       session capsule, so they stay visible when that module is off. */
    .hide-session .state-chip:not(.is-offline):not(.is-switching),
    .hide-session #state-note { display: none !important; }
    .hide-quota #quota-section,
    .hide-quota #quota-empty,
    .hide-quota .tab-btn[data-tab="quota"],
    .hide-quota #panel-quota { display: none !important; }
    .hide-history #history-section { display: none !important; }
    .hide-models #models-section { display: none !important; }
    .hide-context #context-section { display: none !important; }
    .hide-notch .notch-settings-group { display: none !important; }
    .setting-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--agy-subtle);
    }
    .setting-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--agy-fg);
      min-width: 0;
    }
    .setting-row select {
      flex: 0 0 auto;
      max-width: 170px;
      font-size: 12px;
    }
    .setting-input-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }
    .setting-unit {
      font-size: 11px;
      color: var(--agy-fg-muted);
      min-width: 28px;
    }
    .setting-num {
      width: 68px;
      flex: 0 0 auto;
      font: inherit;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: var(--agy-fg);
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .setting-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .setting-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--agy-subtle);
      font-size: 11px;
      color: var(--agy-fg);
      cursor: pointer;
      user-select: none;
    }
    .setting-chip input {
      accent-color: var(--agy-accent);
      margin: 0;
    }
    .setting-toggle {
      width: 16px;
      height: 16px;
      accent-color: var(--agy-accent);
      cursor: pointer;
      flex: 0 0 auto;
    }
    .setting-status {
      font-size: 11px;
      color: var(--agy-ok-fg);
      min-height: 16px;
    }
    .card-label {
      font-size: 11px;
      color: var(--agy-fg-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .card-value {
      font-size: 19px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card.warn .card-value {
      color: var(--agy-warn-fg);
    }
    .card-sub {
      font-size: 11px;
      color: var(--agy-fg-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bar-track {
      height: 5px;
      border-radius: 999px;
      background: var(--agy-subtle);
      overflow: hidden;
      margin-top: 2px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--agy-accent);
      width: 0%;
      transition: width 0.25s ease;
    }
    .bar-fill.high {
      background: var(--agy-warn-fg);
    }
    .section {
      background: var(--agy-card);
      border: 1px solid var(--agy-border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quota-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .quota-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .quota-group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--agy-fg-muted);
    }
    .quota-windows {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .quota-cell {
      background: var(--agy-subtle);
      border-radius: 6px;
      padding: 5px 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 2px 6px;
      min-width: 0;
    }
    .quota-label {
      color: var(--agy-fg-muted);
      white-space: nowrap;
    }
    .quota-time {
      color: var(--agy-fg);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      margin-left: auto;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--agy-fg-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .spark-detail {
      font-size: 11px;
      font-weight: 500;
      color: var(--agy-fg);
      background: var(--agy-subtle);
      border: 1px solid var(--agy-border);
      border-radius: 6px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-variant-numeric: tabular-nums;
      min-height: 28px;
    }
    .spark-detail .tag {
      font-weight: 600;
      color: var(--agy-accent);
    }
    .spark-detail .tag.warn {
      color: var(--agy-warn-fg);
    }
    .spark {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 54px;
      padding: 8px 2px 2px;
      border-bottom: 1px dashed var(--agy-border);
    }
    .spark-col {
      flex: 1 1 0;
      min-width: 8px;
      max-width: 34px;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      cursor: pointer;
      padding: 0 1px;
      border-radius: 4px;
      transition: background 0.12s ease;
    }
    .spark-col:hover,
    .spark-col.active {
      background: var(--agy-accent-soft);
    }
    .spark-bar {
      width: 100%;
      max-width: 14px;
      border-radius: 3px 3px 1px 1px;
      background: var(--agy-accent);
      opacity: 0.78;
      transition: height 0.2s ease, opacity 0.12s ease, transform 0.12s ease;
    }
    .spark-col:hover .spark-bar,
    .spark-col.active .spark-bar {
      opacity: 1;
      transform: scaleY(1.03);
    }
    .spark-bar.warn {
      background: var(--agy-warn-fg);
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .history-row {
      display: grid;
      grid-template-columns: 38px 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 4px 6px;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .history-row:nth-child(odd) {
      background: var(--agy-subtle);
    }
    .history-row:hover,
    .history-row.active {
      background: var(--agy-accent-soft);
      border-color: var(--agy-accent);
    }
    .speed-badge {
      font-weight: 600;
    }
    .speed-badge.warn {
      color: var(--agy-warn-fg);
    }
    .muted {
      color: var(--agy-fg-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stats-note { color: var(--agy-fg-muted); font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    .usage-hero {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .usage-hero-total {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .usage-hero-total small { font-size: 11px; font-weight: 400; color: var(--agy-fg-muted); }
    .usage-hit-pill {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--agy-subtle);
      color: var(--agy-fg-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .usage-hit-pill.good {
      background: var(--agy-ok-soft);
      color: var(--agy-ok-fg);
    }
    .usage-bar {
      display: flex;
      gap: 1.5px;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--agy-subtle);
    }
    .usage-seg {
      height: 100%;
      min-width: 2px;
      border-radius: 999px;
    }
    .seg-cache { background: var(--agy-accent); }
    .seg-input { background: var(--agy-fg-faint); }
    .seg-out { background: var(--agy-ok-fg); }
    .usage-cells {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .usage-cell {
      background: var(--agy-subtle);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .usage-cell-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: var(--agy-fg-muted);
      white-space: nowrap;
    }
    .usage-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .usage-cell-val {
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .usage-latest {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding-top: 7px;
      border-top: 1px solid var(--agy-border);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .usage-latest-val {
      text-align: right;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .model-card {
      background: var(--agy-subtle);
      border: 1px solid var(--agy-border);
      border-radius: 7px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .model-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .model-name {
      font-size: 12px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .model-meta {
      font-size: 11px;
      color: var(--agy-fg-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .model-metrics {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }
    .model-total {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }
    .model-total small { font-size: 11px; font-weight: 400; color: var(--agy-fg-muted); }
    .model-tags {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      flex: 0 0 auto;
    }
    .model-speed { font-weight: 600; color: var(--agy-fg); }
    .model-speed.warn { color: var(--agy-warn-fg); }
    .model-hit { color: var(--agy-fg-muted); }
    .model-share-track {
      height: 3px;
      border-radius: 999px;
      background: var(--agy-card);
      overflow: hidden;
    }
    .model-share-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--agy-accent);
      opacity: 0.75;
    }
    .model-kv {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      padding-top: 5px;
      border-top: 1px solid var(--agy-border);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .model-kv-item {
      display: flex;
      align-items: baseline;
      gap: 4px;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .model-kv-item strong { font-weight: 600; }
    .context-chart { width: 100%; height: auto; display: block; color: var(--agy-accent); overflow: visible; }
    .context-chart text { font-size: 10px; fill: var(--agy-fg-muted); font-variant-numeric: tabular-nums; }
    .context-chart .ctx-grid { stroke: var(--agy-border); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .context-chart .ctx-line { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .context-chart .ctx-compaction { stroke: var(--agy-warn-fg); stroke-width: 1.25; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
    .context-chart .ctx-dot { fill: var(--agy-card); stroke: currentColor; stroke-width: 1.5; vector-effect: non-scaling-stroke; transition: r 0.1s ease; }
    .context-chart .ctx-dot.active { fill: currentColor; }
    .context-chart .ctx-guide { stroke: var(--agy-accent); stroke-opacity: 0.35; stroke-width: 1; vector-effect: non-scaling-stroke; opacity: 0; }
    .context-chart .ctx-guide.active { opacity: 1; }
    .context-chart .ctx-hit { fill: transparent; cursor: pointer; }
    .context-records { font-size: 11px; line-height: 1.75; overflow-wrap: anywhere; margin-top: 6px; }
    .section details summary { cursor: pointer; font-size: 11px; color: var(--agy-fg-muted); user-select: none; }
    .section details summary:hover { color: var(--agy-fg); }
    .section details summary:focus-visible { outline: 2px solid var(--agy-accent); outline-offset: 2px; }
    .section details[open] .history-list { margin-top: 6px; }
    @media (max-width: 260px) { .usage-cells, .model-kv { grid-template-columns: 1fr; } }
    .empty {
      padding: 18px 12px;
      text-align: center;
      color: var(--agy-fg-muted);
      font-size: 12px;

<body>
  <div class="shell">
    <div class="toolbar">
      <div class="session-row">
        <span id="live-dot" class="dot" title="Hook 状态"></span>
        <select id="session-select" aria-label="Select conversation">
          <option value="auto">自动跟随当前活跃会话</option>
        </select>
      </div>
      <div class="controls">
        <select id="refresh-select" class="refresh-select active" aria-label="自动刷新间隔" title="自动刷新间隔">
          <option value="3" selected>3s</option>
          <option value="5">5s</option>
          <option value="10">10s</option>
          <option value="0">暂停</option>
        </select>
      </div>
    </div>

    <div id="meta-strip" class="meta-strip"></div>
    <div id="state-note" class="state-note" hidden></div>
    <div id="sources-note" class="sources-note" hidden></div>

    <div id="cards" class="grid"></div>

    <div id="tab-bar" class="tabs" role="tablist">
      <button type="button" class="tab-btn active" data-tab="trends" role="tab" aria-selected="true">趋势</button>
      <button type="button" class="tab-btn" data-tab="usage" role="tab" aria-selected="false">用量</button>
      <button type="button" class="tab-btn" data-tab="quota" role="tab" aria-selected="false">额度</button>
      <button type="button" class="tab-btn" data-tab="settings" role="tab" aria-selected="false">设置</button>
    </div>

    <div id="panel-trends" class="tab-panel active" data-panel="trends">
      <div id="history-section" class="section" style="display:none">
        <div class="section-title">
          <span>输出速度趋势</span>
          <span id="history-count" class="muted"></span>
        </div>
        <div id="spark-detail" class="spark-detail"></div>
        <div id="spark" class="spark"></div>
        <details>
          <summary>近期明细</summary>
          <div id="history-list" class="history-list"></div>
        </details>
      </div>

      <div id="context-section" class="section" style="display:none"></div>
    </div>

    <div id="panel-usage" class="tab-panel" data-panel="usage">
      <div id="usage-section" class="section" style="display:none"></div>
      <div id="models-section" class="section" style="display:none"></div>
    </div>

    <div id="panel-quota" class="tab-panel" data-panel="quota">
      <div id="quota-section" class="section" style="display:none">
        <div class="section-title">
          <span>额度重置时间</span>
          <span id="quota-note" class="muted"></span>
        </div>
        <div id="quota-list" class="quota-list"></div>
      </div>
      <div id="quota-empty" class="section empty" style="display:none">暂无额度重置数据，运行一次 agy CLI 后自动同步。</div>
    </div>

    <div id="panel-settings" class="tab-panel" data-panel="settings">
      <div class="section">
        <div class="section-title">
          <span>面板与模块</span>
          <span id="settings-save-status" class="setting-status"></span>
        </div>
        <div class="setting-list">
          <div class="setting-row" title="详细模式会内联显示卡顿原因与数据源说明">
            <span class="setting-label">布局密度</span>
            <select id="cfg-layout" aria-label="布局密度">
              <option value="compact">紧凑</option>
              <option value="detailed">详细</option>
            </select>
          </div>
          <div class="setting-row" title="未在顶部手动锁定时使用的轮询节奏">
            <span class="setting-label">默认刷新间隔</span>
            <select id="cfg-poll-sec" aria-label="默认刷新间隔">
              <option value="0">自适应</option>
              <option value="3">3s</option>
              <option value="5">5s</option>
              <option value="10">10s</option>
            </select>
          </div>
          <div class="setting-chips">
            <label class="setting-chip"><input id="cfg-mod-session" type="checkbox" checked />状态徽章</label>
            <label class="setting-chip"><input id="cfg-mod-history" type="checkbox" checked />速度趋势</label>
            <label class="setting-chip"><input id="cfg-mod-context" type="checkbox" checked />上下文曲线</label>
            <label class="setting-chip"><input id="cfg-mod-models" type="checkbox" checked />模型用量</label>
            <label class="setting-chip"><input id="cfg-mod-quota" type="checkbox" checked />额度重置</label>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <span>性能与告警阈值</span>
        </div>
        <div class="setting-list">
          <div class="setting-row" title="输出速度低于该值时标黄提醒">
            <span class="setting-label">低速警告</span>
            <span class="setting-input-wrap">
              <input id="cfg-low-speed" type="number" class="setting-num" min="1" max="10000" step="1" value="50" />
              <span class="setting-unit">tok/s</span>
            </span>
          </div>
          <div class="setting-row" title="发出请求后超过该时间未吐字标为等待中">
            <span class="setting-label">等待首字超时</span>
            <span class="setting-input-wrap">
              <input id="cfg-wait-sec" type="number" class="setting-num" min="1" max="3600" step="1" value="20" />
              <span class="setting-unit">s</span>
            </span>
          </div>
          <div class="setting-row" title="流式输出中断超过该时间标为卡顿">
            <span class="setting-label">输出卡顿超时</span>
            <span class="setting-input-wrap">
              <input id="cfg-stall-sec" type="number" class="setting-num" min="1" max="3600" step="1" value="25" />
              <span class="setting-unit">s</span>
            </span>
          </div>
          <div class="setting-row" title="运行命令/测试期间多久内不判定为卡顿">
            <span class="setting-label">工具执行宽限期</span>
            <span class="setting-input-wrap">
              <input id="cfg-tool-grace" type="number" class="setting-num" min="1" max="3600" step="1" value="120" />
              <span class="setting-unit">s</span>
            </span>
          </div>
        </div>
      </div>

      <div class="section notch-settings-group">
        <div class="section-title">
          <span>macOS 刘海状态栏</span>
        </div>
        <div class="setting-list">
          <label class="setting-row" title="在屏幕顶部刘海区域展示实时任务状态">
            <span class="setting-label">显示刘海状态栏</span>
            <input id="notch-enabled" type="checkbox" class="setting-toggle" checked />
          </label>
          <label class="setting-row" title="无活跃任务时收起至物理刘海内，悬停自动展开">
            <span class="setting-label">空闲时隐入刘海</span>
            <input id="notch-hide-idle" type="checkbox" class="setting-toggle" />
          </label>
          <div class="setting-row" title="外接显示器时决定刘海状态栏显示在哪块屏幕">
            <span class="setting-label">多屏幕显示</span>
            <select id="notch-screen-mode" aria-label="多屏幕显示">
              <option value="notchOrMain">优先刘海屏</option>
              <option value="followActive">跟随活跃屏幕</option>
              <option value="allScreens">所有屏幕显示</option>
            </select>
          </div>
          <div class="setting-row" title="与其他刘海工具重叠时的避让策略">
            <span class="setting-label">刘海被占用时</span>
            <select id="notch-avoidance-mode" aria-label="刘海被占用时">
              <option value="autoStackBelow">自动避让下移</option>
              <option value="forceNotch">强制贴合刘海</option>
              <option value="topRight">悬浮在右上角</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div id="empty-box" class="section empty" style="display:none"></div>
  </div>
